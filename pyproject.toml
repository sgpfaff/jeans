[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jeans"
version = "1.0.1"
description = "Jeans modelling for SIDM halos."
authors = [
  { name = "Sean Tulin", email = "stulin@yorku.ca" },
  { name = "Adam Smith-Orlik", email = "asorlik@yorku.ca" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.3,<3", 
  "scipy>=1.16,<2",
  "dill>=0.4,<1",
]

[project.optional-dependencies]
# Orbit libraries for jeanie.export. None is required to solve a halo; each
# is imported only by its own exporter.
#
# galax is deliberately absent. Its PyPI releases are 0.0.2 and 0.0.3, both
# years behind the repository: 0.0.2 imports a private equinox symbol that
# equinox 0.13 no longer has (`_has_dataclass_init`), and 0.0.3 requires
# `tfp-nightly`, which no longer publishes. Listing `galax` here would
# install the broken 0.0.2. The working install is from the monorepo, whose
# subpackages are not on PyPI either, so all of them are named explicitly:
#
#   git clone --depth 1 https://github.com/GalacticDynamics/galax
#   pip install ./galax/packages/galax.coordinates \
#               ./galax/packages/galax.potential \
#               ./galax/packages/galax.interop.astropy ./galax
#
# Install those before the metapackage, and if pip removed an older `galax`
# during the run, repeat with --no-deps --force-reinstall: the uninstall
# takes `galax/__init__.py` and `galax/potential/__init__.py` with it and
# leaves a namespace package that imports as empty.
# galpy >= 1.12 for MultipoleExpansionPotential, which is what
# to_galpy(kind="multipole") is built on. On 1.11 that raises with a pointer
# to kind="multipole-ref", jeanie's own expansion, which needs nothing
# beyond the Potential base class.
galpy = ["galpy>=1.12"]
agama = ["agama"]
export = ["galpy>=1.12", "agama"]

[project.urls]
"Source Code" = "https://github.com/dark-physics/jeans.git"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# Two packages live here for now. `jeans` is the fork of upstream, carrying
# the six defect fixes so they stay a clean diff for an eventual PR, and the
# test suite uses it as the reference it validates against. `jeanie` is the
# fast, differentiable layer, which imports nothing from `jeans` at runtime.
#
# NOTE before anything is ever published: the distribution name below cannot
# stay "jeans". That name is taken on PyPI by an unrelated package of the
# same subfield (Matthew Walker, CMU, v2.4.2, "integrals related to the
# spherical Jeans equation"), so upstream cannot publish under it either.
# "jeanie" is free. Picking the final metadata belongs with the repo split,
# not with an import rewrite, so it is deliberately left alone here.
include = ["jeans*", "jeanie*"]

[tool.setuptools.package-data]
jeans = ["data/*.csv"]

[tool.black]
line-length = 120