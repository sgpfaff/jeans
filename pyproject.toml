[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jeans"
version = "1.0.1"
description = "Jeans modelling for SIDM halos."
authors = [
  { name = "Sean Tulin", email = "stulin@yorku.ca" },
  { name = "Adam Smith-Orlik", email = "asorlik@yorku.ca" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.3,<3", 
  "scipy>=1.16,<2",
  "dill>=0.4,<1",
]

[project.optional-dependencies]
# Orbit libraries for jeanie.export. None is required to solve a halo; each
# is imported only by its own exporter. agama compiles C++, so it is slow to
# install; galax pulls in jax, equinox and unxt.
galpy = ["galpy>=1.11"]
agama = ["agama"]
galax = ["galax"]
export = ["galpy>=1.11", "agama", "galax"]

[project.urls]
"Source Code" = "https://github.com/dark-physics/jeans.git"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# Two packages live here for now. `jeans` is the fork of upstream, carrying
# the six defect fixes so they stay a clean diff for an eventual PR, and the
# test suite uses it as the reference it validates against. `jeanie` is the
# fast, differentiable layer, which imports nothing from `jeans` at runtime.
#
# NOTE before anything is ever published: the distribution name below cannot
# stay "jeans". That name is taken on PyPI by an unrelated package of the
# same subfield (Matthew Walker, CMU, v2.4.2, "integrals related to the
# spherical Jeans equation"), so upstream cannot publish under it either.
# "jeanie" is free. Picking the final metadata belongs with the repo split,
# not with an import rewrite, so it is deliberately left alone here.
include = ["jeans*", "jeanie*"]

[tool.setuptools.package-data]
jeans = ["data/*.csv"]

[tool.black]
line-length = 120